name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled

jobs:

  # ============================================================
  # 1. SECURITY SCAN
  # ============================================================

  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      critical: ${{ steps.audit.outputs.critical }}
      high: ${{ steps.audit.outputs.high }}
      moderate: ${{ steps.audit.outputs.moderate }}
      low: ${{ steps.audit.outputs.low }}
      total: ${{ steps.audit.outputs.total }}
      approval_required: ${{ steps.audit.outputs.approval_required }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Node
      # --------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --------------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------------

      - name: Install Dependencies
        run: npm i --legacy-peer-deps

      # --------------------------------------------------------
      # Run Security Audit
      # --------------------------------------------------------

      - name: Run Security Audit
        id: audit
        shell: bash
        run: |

          echo "=========================================="
          echo "🔐 RUNNING SECURITY AUDIT"
          echo "=========================================="

          set +e

          npm audit --json > audit_report.json
          AUDIT_EXIT=$?

          set -e

          echo "npm audit exit code: $AUDIT_EXIT"

          # ------------------------------------------------------
          # Make sure report exists
          # ------------------------------------------------------

          if [ ! -s audit_report.json ]; then
            echo "❌ Security audit did not produce a report."
            exit 1
          fi

          # ------------------------------------------------------
          # Extract vulnerability counts
          # ------------------------------------------------------

          CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' audit_report.json)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' audit_report.json)
          MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' audit_report.json)
          LOW=$(jq -r '.metadata.vulnerabilities.low // 0' audit_report.json)
          TOTAL=$(jq -r '.metadata.vulnerabilities.total // 0' audit_report.json)

          echo ""
          echo "=========================================="
          echo "🔍 SECURITY SUMMARY"
          echo "=========================================="

          echo "Critical : $CRITICAL"
          echo "High     : $HIGH"
          echo "Moderate : $MODERATE"
          echo "Low      : $LOW"
          echo "Total    : $TOTAL"

          echo "=========================================="

          # ------------------------------------------------------
          # Export outputs
          # ------------------------------------------------------

          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "moderate=$MODERATE" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          # ------------------------------------------------------
          # Determine approval requirement
          # ------------------------------------------------------

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then

            echo "approval_required=false" >> "$GITHUB_OUTPUT"

          elif [ "$MODERATE" -gt 0 ] || [ "$LOW" -gt 0 ]; then

            echo "approval_required=true" >> "$GITHUB_OUTPUT"

          else

            echo "approval_required=false" >> "$GITHUB_OUTPUT"

          fi

      # --------------------------------------------------------
      # Upload Audit Report
      # --------------------------------------------------------

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: audit_report.json
          if-no-files-found: warn


  # ============================================================
  # 2. HARD SECURITY BLOCK
  #
  # Critical / High = PERMANENT BLOCK
  # ============================================================

  security-block:
    name: 🚨 Security Block

    needs: security

    if: |
      needs.security.outputs.critical != '0' ||
      needs.security.outputs.high != '0'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUM: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}

      DEV_USERNAME: ${{ github.event.pull_request.user.login }}

      MANAGER_NAME: ${{ vars.MANAGER_NAME }}
      MANAGER_USERNAME: ${{ vars.MANAGER_USERNAME }}

      TEAMS_WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK_URL }}

    steps:
      - name: Block High/Critical Vulnerabilities
        shell: bash
        run: |

          echo "=========================================="
          echo "🚨 SECURITY BLOCK"
          echo "=========================================="

          echo "PR:        #$PR_NUM"
          echo "Developer: @$DEV_USERNAME"
          echo "Manager:   $MANAGER_NAME (@$MANAGER_USERNAME)"

          echo ""
          echo "Critical vulnerabilities: ${{ needs.security.outputs.critical }}"
          echo "High vulnerabilities:     ${{ needs.security.outputs.high }}"

          echo ""
          echo "❌ Merge is permanently blocked."
          echo "=========================================="

          # ------------------------------------------------------
          # Send Teams notification
          # ------------------------------------------------------

          if [ -z "$TEAMS_WEBHOOK" ]; then

            echo "⚠️ MS Teams webhook is not configured."
            echo "⚠️ Skipping Teams notification."

          else

            echo "📢 Sending security alert to Microsoft Teams..."

            JSON_PAYLOAD=$(jq -n \
              --arg pr "#$PR_NUM $PR_TITLE" \
              --arg developer "@$DEV_USERNAME" \
              --arg manager "$MANAGER_NAME (@$MANAGER_USERNAME)" \
              --arg critical "${{ needs.security.outputs.critical }}" \
              --arg high "${{ needs.security.outputs.high }}" \
              --arg pr_url "$PR_URL" \
              --arg workflow_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                "@type": "MessageCard",
                "@context": "http://schema.org/extensions",
                "themeColor": "cb2431",
                "summary": "Security Gate Failed",
                "sections": [
                  {
                    "activityTitle": "🚨 SECURITY ALERT",
                    "activitySubtitle": "High/Critical vulnerabilities detected",
                    "facts": [
                      {
                        "name": "Pull Request",
                        "value": $pr
                      },
                      {
                        "name": "Developer",
                        "value": $developer
                      },
                      {
                        "name": "Manager",
                        "value": $manager
                      },
                      {
                        "name": "Critical",
                        "value": $critical
                      },
                      {
                        "name": "High",
                        "value": $high
                      }
                    ],
                    "text": "❌ Merge is permanently blocked.\n\n[View Pull Request](\($pr_url))\n\n[View Workflow Run](\($workflow_url))",
                    "markdown": true
                  }
                ]
              }'
            )

            curl -fsS \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD" \
              "$TEAMS_WEBHOOK"

            echo "✅ Teams notification sent."

          fi

          # ------------------------------------------------------
          # Block job
          # ------------------------------------------------------

          exit 1


  # ============================================================
  # 3. SECURITY APPROVAL
  #
  # Moderate / Low → Manager approval required
  # ============================================================

  security-approval:
    name: 🛡️ Security Approval

    needs: security

    if: |
      needs.security.outputs.critical == '0' &&
      needs.security.outputs.high == '0' &&
      (
        needs.security.outputs.moderate != '0' ||
        needs.security.outputs.low != '0'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}

      MANAGER_USERNAME: ${{ vars.MANAGER_USERNAME }}
      MANAGER_NAME: ${{ vars.MANAGER_NAME }}

      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUM: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}

      DEV_USERNAME: ${{ github.event.pull_request.user.login }}

      HAS_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'security-approved') }}

      TEAMS_WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK_URL }}

    steps:

      # --------------------------------------------------------
      # Check Approval
      # --------------------------------------------------------

      - name: Check Security Approval
        shell: bash
        run: |

          echo "=========================================="
          echo "🛡️ SECURITY APPROVAL CHECK"
          echo "=========================================="

          echo "Critical : ${{ needs.security.outputs.critical }}"
          echo "High     : ${{ needs.security.outputs.high }}"
          echo "Moderate : ${{ needs.security.outputs.moderate }}"
          echo "Low      : ${{ needs.security.outputs.low }}"

          echo ""
          echo "Developer : @$DEV_USERNAME"
          echo "Manager   : $MANAGER_NAME (@$MANAGER_USERNAME)"
          echo "Approval  : $HAS_OVERRIDE"

          echo "=========================================="

          # ------------------------------------------------------
          # APPROVED
          # ------------------------------------------------------

          if [ "$HAS_OVERRIDE" = "true" ]; then

            echo "✅ security-approved label is present."
            echo "➡️ Security exception approved."
            echo "➡️ CI may continue."

            exit 0

          fi

          # ------------------------------------------------------
          # NOT APPROVED
          # ------------------------------------------------------

          echo "⚠️ security-approved label is NOT present."
          echo "⏸️ Manager approval required."

          # ------------------------------------------------------
          # PR COMMENT
          # ------------------------------------------------------

          gh pr comment "$PR_URL" --body \
          "### ⚠️ Security Approval Required

          The CI/CD pipeline detected **Low/Moderate vulnerabilities**.

          **Security Summary**

          - 🔴 Critical: ${{ needs.security.outputs.critical }}
          - 🟠 High: ${{ needs.security.outputs.high }}
          - 🟡 Moderate: ${{ needs.security.outputs.moderate }}
          - 🟢 Low: ${{ needs.security.outputs.low }}

          **Developer:** @$DEV_USERNAME

          **Manager:** @$MANAGER_USERNAME

          **Action Required**

          Please review the security audit.

          If you approve the security exception, add:

          \`security-approved\`

          to this Pull Request.

          **PR:** $PR_URL"

          # ------------------------------------------------------
          # TEAMS
          # ------------------------------------------------------

          if [ -z "$TEAMS_WEBHOOK" ]; then

            echo "⚠️ MS Teams webhook is not configured."

          else

            MSG="⚠️ ACTION REQUIRED

            Pull Request #$PR_NUM has Low/Moderate security vulnerabilities.

            Developer: @$DEV_USERNAME
            Manager: $MANAGER_NAME (@$MANAGER_USERNAME)

            Security Summary:
            Critical: ${{ needs.security.outputs.critical }}
            High: ${{ needs.security.outputs.high }}
            Moderate: ${{ needs.security.outputs.moderate }}
            Low: ${{ needs.security.outputs.low }}

            Manager approval is required.

            To approve:
            GitHub → Pull Request → Labels → security-approved

            PR: $PR_URL"

            JSON_PAYLOAD=$(jq -n \
              --arg msg "$MSG" \
              '{
                "@type": "MessageCard",
                "@context": "http://schema.org/extensions",
                "themeColor": "f59e0b",
                "summary": "Security Approval Required",
                "sections": [
                  {
                    "activityTitle": "⚠️ SECURITY APPROVAL REQUIRED",
                    "text": $msg,
                    "markdown": true
                  }
                ]
              }'
            )

            curl -fsS \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD" \
              "$TEAMS_WEBHOOK"

            echo "✅ Teams notification sent."

          fi

          # ------------------------------------------------------
          # Block
          # ------------------------------------------------------

          echo ""
          echo "❌ Security approval has NOT been granted."
          echo "❌ CI is blocked."

          exit 1


  # ============================================================
  # 4. TESTS
  #
  # Tests run only after security has passed.
  # ============================================================

  test-and-report:
    name: 🧪 Tests

    needs:
      - security
      - security-block
      - security-approval

    # ----------------------------------------------------------
    # Run when:
    #
    # 1. Security scan passed
    # 2. No hard security block
    # 3. Either:
    #    - no moderate/low vulnerabilities
    #    - OR security-approved label exists
    # ----------------------------------------------------------

    if: |
      always() &&
      needs.security.result == 'success' &&
      (
        needs.security-block.result == 'skipped' ||
        needs.security-block.result == 'success'
      ) &&
      (
        needs.security-approval.result == 'skipped' ||
        needs.security-approval.result == 'success'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUM: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}

      # IMPORTANT:
      # This is the person who created the PR.
      DEV_USERNAME: ${{ github.event.pull_request.user.login }}

      # Person who triggered this workflow run.
      TRIGGERED_BY: ${{ github.actor }}

      MANAGER_NAME: ${{ vars.MANAGER_NAME }}
      MANAGER_USERNAME: ${{ vars.MANAGER_USERNAME }}

      TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Node
      # --------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --------------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------------

      - name: Install Dependencies
        run: npm i --legacy-peer-deps

      # --------------------------------------------------------
      # Run Tests
      # --------------------------------------------------------

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        shell: bash
        run: |

          echo "=========================================="
          echo "🧪 RUNNING TEST CASES"
          echo "=========================================="

          TEST_CMD=$(node -p "require('./package.json').scripts?.test || ''")

          if [ -z "$TEST_CMD" ]; then

            echo "⚠️ No test script found in package.json."
            echo "⚠️ Skipping tests."

            exit 0

          fi

          echo "Test command:"
          echo "$TEST_CMD"

          npm run test -- --reporter=json --outputFile=test-results.json


      # --------------------------------------------------------
      # Test Result Analysis
      # --------------------------------------------------------

      - name: Analyze Test Results
        id: analyze_tests
        if: always()
        shell: bash
        run: |

          TOTAL=0
          PASSED=0
          FAILED=0
          SKIPPED=0

          if [ -f "test-results.json" ]; then

            TOTAL=$(jq '[.testResults[]?.assertionResults[]?] | length' test-results.json 2>/dev/null || echo 0)

            PASSED=$(jq '[.testResults[]?.assertionResults[]? | select(.status == "passed")] | length' test-results.json 2>/dev/null || echo 0)

            FAILED=$(jq '[.testResults[]?.assertionResults[]? | select(.status == "failed")] | length' test-results.json 2>/dev/null || echo 0)

            SKIPPED=$(jq '[.testResults[]?.assertionResults[]? | select(.status == "skipped" or .status == "pending")] | length' test-results.json 2>/dev/null || echo 0)

          fi

          echo "Total   : $TOTAL"
          echo "Passed  : $PASSED"
          echo "Failed  : $FAILED"
          echo "Skipped : $SKIPPED"

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Extract Failing Tests
      # --------------------------------------------------------

      - name: Extract Failing Tests
        id: failing_tests
        if: always()
        shell: bash
        run: |

          FAILING_TESTS=""

          if [ -f "test-results.json" ]; then

            FAILING_TESTS=$(jq -r '
              .testResults[]?.assertionResults[]?
              | select(.status == "failed")
              | "- " +
                (
                  ((.ancestorTitles // []) + [.title])
                  | join(" > ")
                )
            ' test-results.json 2>/dev/null | head -n 10)

          fi

          if [ -z "$FAILING_TESTS" ]; then
            FAILING_TESTS="No failing test details available."
          fi

          {
            echo "list<<EOF"
            echo "$FAILING_TESTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Upload Test Results
      # --------------------------------------------------------

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json
          if-no-files-found: ignore

      # --------------------------------------------------------
      # Teams Notification
      # --------------------------------------------------------

      - name: Send MS Teams Notification
        if: always()
        shell: bash
        run: |

          echo "=========================================="
          echo "📢 CI NOTIFICATION"
          echo "=========================================="

          if [ -z "$TEAMS_WEBHOOK" ]; then

            echo "⚠️ TEAMS_WEBHOOK is not configured."
            echo "⚠️ Skipping notification."

            exit 0

          fi

          # ------------------------------------------------------
          # Determine test status
          # ------------------------------------------------------

          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then

            COLOR="28a745"
            STATUS="✅ SUCCESS"
            SUMMARY="All tests passed successfully."

          else

            COLOR="cb2431"
            STATUS="❌ FAILED"
            SUMMARY="One or more tests failed."

          fi

          # ------------------------------------------------------
          # Create Teams payload
          # ------------------------------------------------------

          PAYLOAD=$(jq -n \
            --arg color "$COLOR" \
            --arg status "$STATUS" \
            --arg summary "$SUMMARY" \
            --arg pr "#$PR_NUM $PR_TITLE" \
            --arg developer "@$DEV_USERNAME" \
            --arg triggered "@$TRIGGERED_BY" \
            --arg manager "$MANAGER_NAME (@$MANAGER_USERNAME)" \
            --arg branch "${{ github.head_ref }}" \
            --arg commit "${{ github.event.pull_request.head.sha }}" \
            --arg pr_url "$PR_URL" \
            --arg workflow_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg total "${{ steps.analyze_tests.outputs.total }}" \
            --arg passed "${{ steps.analyze_tests.outputs.passed }}" \
            --arg failed "${{ steps.analyze_tests.outputs.failed }}" \
            --arg skipped "${{ steps.analyze_tests.outputs.skipped }}" \
            --arg failing_tests "${{ steps.failing_tests.outputs.list }}" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": $color,
              "summary": "GitHub Actions CI Report",

              "sections": [
                {
                  "activityTitle": ("Pull Request CI Report: " + $status),
                  "activitySubtitle": $pr,

                  "facts": [
                    {
                      "name": "Developer",
                      "value": $developer
                    },
                    {
                      "name": "Manager",
                      "value": $manager
                    },
                    {
                      "name": "Triggered By",
                      "value": $triggered
                    },
                    {
                      "name": "Branch",
                      "value": $branch
                    },
                    {
                      "name": "Commit",
                      "value": $commit
                    },
                    {
                      "name": "Total Tests",
                      "value": $total
                    },
                    {
                      "name": "Passed",
                      "value": $passed
                    },
                    {
                      "name": "Failed",
                      "value": $failed
                    },
                    {
                      "name": "Skipped",
                      "value": $skipped
                    }
                  ],

                  "text": (
                    $summary
                    + "\n\n"
                    + "**Failing Tests:**\n"
                    + $failing_tests
                    + "\n\n"
                    + "[View Pull Request]("
                    + $pr_url
                    + ")"
                    + "\n\n"
                    + "[View Workflow Run]("
                    + $workflow_url
                    + ")"
                  ),

                  "markdown": true
                }
              ]
            }'
          )

          # ------------------------------------------------------
          # Send Teams notification
          # ------------------------------------------------------

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$TEAMS_WEBHOOK"

          echo ""
          echo "✅ Teams notification sent."

      # --------------------------------------------------------
      # Finally Fail CI if Tests Failed
      # --------------------------------------------------------

      - name: Fail CI if Tests Failed
        if: steps.run_tests.outcome != 'success'
        shell: bash
        run: |

          echo "=========================================="
          echo "❌ TESTS FAILED"
          echo "=========================================="

          echo "Developer: @$DEV_USERNAME"
          echo "Manager:   $MANAGER_NAME (@$MANAGER_USERNAME)"
          echo "PR:        $PR_URL"

          exit 1
